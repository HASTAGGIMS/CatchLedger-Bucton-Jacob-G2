<div class="cl-hero card border-0 mb-4">
  <div class="card-body d-flex flex-wrap align-items-center gap-3">
    {% include "includes/_avatar.html" with person=user size="lg" %}
    <div class="flex-grow-1">
      <h1 class="h4 mb-1">Hello, {{ user.display_name }}</h1>
      <p class="mb-0 opacity-75">{{ blurb }}</p>
    </div>
    <span class="badge role-badge role-{{ user.role|lower }} fs-6">{{ user.role }}</span>
  </div>
</div>
