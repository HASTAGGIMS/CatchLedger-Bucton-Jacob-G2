{% extends "base.html" %}
{% block title %}Access denied{% endblock %}
{% block content %}
<div class="text-center py-5">
  <div class="display-1 text-cl"><i class="bi bi-shield-lock"></i></div>
  <h1 class="h3 mt-3">Access denied</h1>
  <p class="text-muted">Your account role does not have permission to open this page.</p>
  {% if user.is_authenticated %}
    <a class="btn btn-cl" href="{% url 'accounts:dashboard' %}">Go to my dashboard</a>
  {% else %}
    <a class="btn btn-cl" href="{% url 'accounts:login' %}">Log in</a>
  {% endif %}
</div>
{% endblock %}
