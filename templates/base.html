{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CatchLedger{% endblock %} | CatchLedger</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/catchledger.css' %}" rel="stylesheet">
</head>
<body class="{% block body_class %}{% endblock %}">
  {% if user.is_authenticated %}{% include "includes/_navbar.html" %}{% endif %}

  <main class="{% block main_class %}container py-4{% endblock %}">
    {% include "includes/_messages.html" %}
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
